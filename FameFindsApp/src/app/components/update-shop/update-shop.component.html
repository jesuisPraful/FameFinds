<div class="update-shop-container">
  <h2>Update Shop Details</h2>

  <form (ngSubmit)="updateShop()">

    <!-- Shop ID -->
    <div class="form-group">
      <label for="shopId">Shop ID</label>
      <input type="number" id="shopId" [(ngModel)]="shopId" name="shopId" class="form-control" required />
    </div>

    <!-- Contact Number -->
    <div class="form-group">
      <label for="contactNumber">Contact Number</label>
      <input type="text" id="contactNumber" [(ngModel)]="contactNumber" name="contactNumber" class="form-control" />
    </div>

    <!-- Email ID -->
    <div class="form-group">
      <label for="emailId">Email ID</label>
      <input type="email" id="emailId" [(ngModel)]="emailId" name="emailId" class="form-control" />
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Update Shop</button>
  </form>
</div>
