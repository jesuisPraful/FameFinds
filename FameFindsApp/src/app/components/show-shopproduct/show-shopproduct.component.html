<div style="width: 90%; margin: 0 auto; font-family: Arial, sans-serif;">
  <h2 style="text-align: center; color: #2a5d9f;">Shop Products for Shop ID: {{ shopId }}</h2>

  <!-- Success message -->
  <div *ngIf="message" style="color: green; text-align: center; margin: 10px 0;">
    {{ message }}
  </div>

  <!-- Error message -->
  <div *ngIf="error" style="color: red; text-align: center; margin: 10px 0;">
    {{ error }}
  </div>

  <!-- Product Table -->
  <table *ngIf="shopProducts.length > 0; else noProducts"
         style="width: 100%; border-collapse: collapse; margin-top: 20px;">
    <thead style="background-color: #f2f2f2;">
      <tr>
        <th style="padding: 8px; border: 1px solid #ccc;">Shop Product ID</th>
        <th style="padding: 8px; border: 1px solid #ccc;">Product ID</th>
        <th style="padding: 8px; border: 1px solid #ccc;">Price</th>
        <th style="padding: 8px; border: 1px solid #ccc;">Stock</th>
        <th style="padding: 8px; border: 1px solid #ccc;">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of shopProducts">
        <td style="padding: 8px; border: 1px solid #ccc; text-align: center;">{{ product.shopProductId }}</td>
        <td style="padding: 8px; border: 1px solid #ccc; text-align: center;">{{ product.productId }}</td>
        <td style="padding: 8px; border: 1px solid #ccc; text-align: center;">₹{{ product.price }}</td>
        <td style="padding: 8px; border: 1px solid #ccc; text-align: center;">{{ product.stock }}</td>
        <td style="padding: 8px; border: 1px solid #ccc; text-align: center;">
          <button (click)="deleteProduct(product.shopProductId)"
                  style="padding: 4px 8px; background-color: red; color: white; border: none; cursor: pointer;">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- No Products Template -->
  <ng-template #noProducts>
    <p style="text-align: center; color: gray; margin-top: 20px;">
      No products available for this shop.
    </p>
  </ng-template>
</div>
