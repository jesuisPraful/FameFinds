<div class="container">
  <h2>Shop Products for Shop ID: {{ shopId }}</h2>

  <!-- Success message -->
  <div *ngIf="message" class="alert alert-success">
    {{ message }}
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Product Table -->
  <table class="table table-bordered" *ngIf="shopProducts.length > 0; else noProducts">
    <thead>
      <tr>
        <th>Shop Product ID</th>
        <th>Product ID</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of shopProducts">
        <td>{{ product.shopProductId }}</td>
        <td>{{ product.productId }}</td>
        <td>{{ product.price }}</td>
        <td>{{ product.stock }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="deleteProduct(product.shopProductId)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- No Products Template -->
  <ng-template #noProducts>
    <p>No products available for this shop.</p>
  </ng-template>
</div>
