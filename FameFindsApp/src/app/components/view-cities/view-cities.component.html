<div class="city-container">
  <h2>All Cities</h2>

  <div *ngFor="let city of filteredCities" class="city-card">
    <p class="city-name">{{ city.cityName }}</p>
    <!-- You can add other details like cityId if needed -->
    <!-- <p>ID: {{ city.cityId }}</p> -->
  </div>

  <p *ngIf="showMessage">No cities found.</p>
</div>
