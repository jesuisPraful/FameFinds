<div class="city-container">
  <h2>All Cities</h2>
  <input type="text"
         [(ngModel)]="searchByName"
         (input)="searchCity(searchByName)"
         placeholder="Search city by name" />
  <div class="city-grid">
    <div *ngFor="let city of filteredCities" class="city-card" (click)="goToProducts(city.cityName)">
      <img [src]="'assets/images/' + city.cityName + '.jpg'" />
      <h3>{{ city.cityName }}</h3>
    </div>
  </div>
</div>
