<form #resetForm="ngForm" (ngSubmit)="reset(resetForm)">
  <div class="reset-password-container">
    <div class="reset-password-card">
      <h2>Reset Password</h2>
      <p>Please enter your new password below.</p>

       New Password 
      <div class="password-field">
        <input [type]="showPasswords ? 'text' : 'password'"
               [(ngModel)]="newPassword"
               name="newPassword"
               placeholder="New Password"
               required />
      </div>

       Confirm Password 
      <div class="password-field">
        <input [type]="showPasswords ? 'text' : 'password'"
               [(ngModel)]="confirmPassword"
               name="confirmPassword"
               placeholder="Confirm Password"
               required />
      </div>

       Password mismatch warning 
      <div class="mismatch-warning" *ngIf="confirmPassword && newPassword !== confirmPassword">
        Passwords do not match.
      </div>

       Toggle show/hide both 
      <div class="password-visibility-toggle">
        <label>
          <input type="checkbox" (change)="toggleBothPasswordsVisibility()" />
          Show Passwords
        </label>
      </div>

       Submit 
      <button type="submit" class="submit-btn" [disabled]="resetForm.invalid || newPassword !== confirmPassword">
        Reset Password
      </button>

       Success and error messages 
      <div *ngIf="message" class="success-message">{{ message }}</div>
      <div *ngIf="error" class="error-message">{{ error }}</div>
    </div>
  </div>
</form>
