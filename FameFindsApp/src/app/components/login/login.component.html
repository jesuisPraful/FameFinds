<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>

    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
      <label for="email">Email Id</label>
      <input #emailRef="ngModel"
             type="email"
             id="email"
             name="email"
             placeholder="Email Address"
             ngModel
             required />
      <div *ngIf="emailRef.errors && emailRef.touched" class="error">
        Email Id is mandatory
      </div>

      <label>Password</label>
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'"
               name="password"
               ngModel
               required
               placeholder="Password"
               (input)="onPasswordInput($event)"
               #pwdRef="ngModel" />

        <span class="eye-icon" (click)="togglePasswordVisibility()">
          <!-- Eye icon (password hidden) -->
          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" fill="#555">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
            <circle cx="12" cy="12" r="2.5"/>
          </svg>

          <!-- Eye-slash icon (password shown) -->
          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" fill="#555">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path d="M12 6c3.31 0 6.31 1.66 8.24 4.24-.39.52-.84 1-1.32 1.44L19.71 13c1.45-1.3 2.25-2.87 2.29-4.67-1.73-4.39-6-7.5-11-7.5-2.16 0-4.17.64-5.87 1.75l1.45 1.45C8.69 7.02 10.3 6 12 6zm-6.5.5L3.41 3.91 2 5.32l2.18 2.18C2.86 9.04 1.79 10.41 1 12c1.73 4.39 6 7.5 11 7.5 1.66 0 3.25-.32 4.7-.9l2.48 2.48 1.41-1.41L5.5 6.5zM12 17c-2.76 0-5-2.24-5-5 0-.92.26-1.77.71-2.5l1.46 1.46A2.993 2.993 0 0012 14c1.65 0 3-1.35 3-3 0-.38-.07-.73-.18-1.06l2.3 2.3c-.88 1.76-2.74 3.26-5.12 3.26z"/>
          </svg>
        </span>
      </div>

      <div class="error" *ngIf="pwdRef.invalid && pwdRef.touched">
        Password is mandatory
      </div>

      <button type="submit"
              [disabled]="loginForm.invalid || passwordLength < 8"
              [ngClass]="{ 'highlight': highlightLogin, 'dull': passwordLength < 8 }">
        Login
      </button>
    </form>
    <div class="links">
      <a routerLink="/forgot-password">Forgot password?</a><br />
      <a routerLink="/register">Don't have an account? <span>Register here</span></a>
    </div>

    <div *ngIf="showDiv" class="message">
      {{ message }}
    </div>
  </div>
</div>
