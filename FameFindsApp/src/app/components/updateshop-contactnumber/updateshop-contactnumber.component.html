<div class="center-wrapper">
  <div class="form-container">
    <label for="shopId">Shop ID:</label>
    <input id="shopId"
           type="number"
           [(ngModel)]="shopId"
           placeholder="Enter Shop ID" />

    <label for="oldContactNumber">Current Contact Number:</label>
    <input id="oldContactNumber"
           type="text"
           [(ngModel)]="oldContactNumber"
           placeholder="Enter current contact number" />

    <label for="newContactNumber">New Contact Number:</label>
    <input id="newContactNumber"
           type="text"
           [(ngModel)]="newContactNumber"
           placeholder="Enter new contact number" />

    <button (click)="updateContactNumber()">Update Contact Number</button>
  </div>
</div>
