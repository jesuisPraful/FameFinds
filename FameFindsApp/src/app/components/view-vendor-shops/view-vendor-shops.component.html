<!-- Header -->
<header class="dashboard-header">
  <div class="left-button">
    <button (click)="goBack()">⬅ Back</button>
  </div>
  <div class="right-button">
    <button (click)="logout()">Logout</button>
  </div>
</header>

<!-- Container -->
<div class="container mt-4">
  <h2 class="text-center mb-4">Your Registered Shops</h2>

  <!-- Shop Cards -->
  <div *ngFor="let shop of filteredShops" class="card mb-4 shadow-sm">
    <div class="card-body">
      <h4 class="card-title">{{ shop.shopName }}</h4>

      <p><strong>City:</strong> {{ getCityName(shop.cityId ?? 0) }}</p>
      <p><strong>Email:</strong> {{ shop.emailId }}</p>
      <p><strong>Contact Number:</strong> {{ shop.contactNumber }}</p>

      <div class="card-buttons">
        <button (click)="goToAddProduct(shop.shopId)">Add Product</button>
        <button (click)="goToViewProduct(shop.shopId)">View Products</button>
      </div>
    </div>
  </div>

  <!-- No shops message -->
  <div *ngIf="filteredShops.length === 0" class="alert alert-info text-center">
    You have not registered any shops yet.
  </div>
</div>
