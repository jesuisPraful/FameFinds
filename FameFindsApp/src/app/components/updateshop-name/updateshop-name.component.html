<div class="center-wrapper">
  <div class="form-container">
    <label for="shopId">Shop ID:</label>
    <input id="shopId"
           type="number"
           [(ngModel)]="shopId"
           placeholder="Enter Shop ID" />

    <label for="currentShopName">Current Shop Name:</label>
    <input id="currentShopName"
           type="text"
           [(ngModel)]="currentShopName"
           placeholder="Enter current Shop Name" />

    <label for="newShopName">New Shop Name:</label>
    <input id="newShopName"
           type="text"
           [(ngModel)]="newShopName"
           placeholder="Enter new Shop Name" />

    <button (click)="updateShopName()">Update Shop Name</button>

    <!-- Success and Error Messages -->
    <div *ngIf="message" class="success">{{ message }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </div>
</div>
