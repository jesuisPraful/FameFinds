<div class="dashboard-container">
  <div class="card-container">

    <div class="card add" (click)="navigateTo('add-shops')">
      <span class="icon">➕</span>
      <p>Add New Shop</p>
    </div>

    <div class="card edit" (click)="navigateTo('update-shop')">
      <span class="icon">📝</span>
      <p>Update Shop</p>
    </div>

    <div class="card rating" (click)="navigateTo('shop-details')">
      <span class="icon">⭐</span>
      <p>View Ratings</p>
    </div>

  </div>
</div>
