<div class="add-shop-container">
  <div class="add-shop-box">
    <h2>Add Your Shop</h2>

    <form (ngSubmit)="addShop()" #addShopForm="ngForm">

      <label for="shopName">Shop Name</label>
      <input type="text" id="shopName" name="shopName" [(ngModel)]="newShop.shopName" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="newShop.emailId" required />

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" [(ngModel)]="newShop.contactNumber" required />

      <label for="city">City</label>
      <input type="text" id="city" name="cityId" [(ngModel)]="newShop.cityId" required />

      <label for="pinCode">Pin Code</label>
      <input type="text" id="pinCode" name="pincode" [(ngModel)]="newShop.pincode" required />

      <label for="address">Address</label>
      <!--<inputtextarea id="address" name="fullAddress" [(ngModel)]="newShop.fullAddress" required></inputtextarea>-->
      <input type="text" id="Address" name="address" [(ngModel)]="newShop.fullAddress" required />

      <div class="location-buttons">
        <button type="button" (click)="message='Please click on the map to select a location.'">📍 Use My Location</button>
        <button type="button" (click)="message='Please click on the map to select a location.'">🗺️ Select on Map</button>
      </div>


      <div class="map-section">
        <google-map height="60px" width="100%" [center]="center" [zoom]="zoom" (mapClick)="onMapClick($event)">
          <map-marker *ngIf="markerPosition" [position]="markerPosition"></map-marker>
        </google-map>
      </div>

      <div class="time-row">
        <div>
          <label for="openingTime">Opening Time</label>
          <input type="time" id="openingTime" name="openingTime" [(ngModel)]="newShop.openingTime" required />
        </div>
        <div>
          <label for="closingTime">Closing Time</label>
          <input type="time" id="closingTime" name="closingTime" [(ngModel)]="newShop.closingTime" required />
        </div>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="isOpen" name="isOpen" [(ngModel)]="newShop.isOpen" />
        <label for="isOpen">Shop is currently open</label>
      </div>

      <button type="submit" class="submit-btn">Add Shop</button>

      <div *ngIf="message" class="error-message">{{ message }}</div>

    </form>
  </div>
</div>
