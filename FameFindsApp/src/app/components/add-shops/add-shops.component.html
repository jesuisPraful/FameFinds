<div class="form-container">
  <h2 class="form-title">Add New Shop</h2>

  <form [formGroup]="shopForm" (ngSubmit)="addShop()" class="shop-form">
    <div class="form-group">
      <label for="shopName">Shop Name</label>
      <input type="text" id="shopName" formControlName="shopName" placeholder="Enter Shop Name" />
    </div>

    <div class="form-group">
      <label for="emailId">Email</label>
      <input type="email" id="emailId" formControlName="emailId" placeholder="Enter Email Address" />
    </div>

    <div class="form-group">
      <label for="contactNumber">Contact Number</label>
      <input type="tel" id="contactNumber" formControlName="contactNumber" placeholder="Enter Contact Number" />
    </div>

    <div class="form-group">
      <label for="cityId">City</label>
      <select id="cityId" formControlName="cityId">
        <option value="" disabled selected>Select a city</option>
        <option *ngFor="let city of cities" [value]="city.cityId">{{ city.cityName }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="pincode">Pincode</label>
      <input type="text" id="pincode" formControlName="pincode" placeholder="Enter Pincode" />
    </div>

    <div class="form-group">
      <label for="fullAddress">Address</label>
      <input type="text" id="fullAddress" formControlName="fullAddress" placeholder="Enter Full Address" />
    </div>

    <div class="form-group-row">
      <div class="form-group">
        <label for="openingTime">Opening Time</label>
        <input type="time" id="openingTime" formControlName="openingTime" />
      </div>

      <div class="form-group">
        <label for="closingTime">Closing Time</label>
        <input type="time" id="closingTime" formControlName="closingTime" />
      </div>
    </div>

    <div class="form-group-checkbox">
      <input type="checkbox" id="isOpen" formControlName="isOpen" />
      <label for="isOpen">Currently Open</label>
    </div>

    <div class="button-group">
      <button type="button" class="location-btn" (click)="useMyLocation()">Use My Location</button>
      <button type="button" class="location-btn" (click)="navigateToMap()">Select on Map</button>
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      {{ loading ? 'Submitting...' : 'Add Shop' }}
    </button>

    <p *ngIf="message" class="form-message">{{ message }}</p>
  </form>

  <div *ngIf="showToast" class="toast">📍 Location updated from Map</div>
</div>
