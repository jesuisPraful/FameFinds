<div class="add-shop-container">
  <h2>Add Your Shop</h2>

  <form [formGroup]="shopForm" (ngSubmit)="addShop()" novalidate>
    <div class="form-group">
      <label>Shop Name</label>
      <input formControlName="shopName" type="text" placeholder="e.g. The Trendy Store" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input formControlName="emailId" type="email" placeholder="e.g. trendy@email.com" />
    </div>

    <div class="form-group">
      <label>Contact Number</label>
      <input formControlName="contactNumber" type="tel" placeholder="e.g. 9876543210" />
    </div>

    <div class="form-group">
      <label>City</label>
      <select formControlName="cityId">
        <option value="">Select City</option>
        <option *ngFor="let city of cities" [value]="city.cityId">
          {{ city.cityName }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Pin Code</label>
      <input formControlName="pincode" type="text" placeholder="e.g. 500081" />
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea formControlName="fullAddress" rows="2" placeholder="Full Address"></textarea>
    </div>

    <div class="form-buttons">
      <button type="button" class="location-btn" (click)="useMyLocation()">📍 Use My Location</button>
      <button type="button" class="map-btn" (click)="navigateToMap()">🗺️ Select on Map</button>
    </div>

    <div class="form-group">
      <label>Opening Time</label>
      <input type="time" formControlName="openingTime" />
    </div>

    <div class="form-group">
      <label>Closing Time</label>
      <input type="time" formControlName="closingTime" />
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox"
             class="form-check-input"
             id="isOpen"
             formControlName="isOpen">
      <label class="form-check-label" for="isOpen">Shop is currently open</label>
    </div>


    <div class="form-actions">
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Adding...' : 'Add Shop' }}
      </button>
    </div>

    <div class="status-message" *ngIf="message">{{ message }}</div>
  </form>
</div>
