<div class="container">
  <h2>Update Shop Product Price</h2>

  <div *ngIf="message" class="alert alert-success">{{ message }}</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form (ngSubmit)="updatePrice()">
    <div class="form-group">
      <label>Shop Product ID:</label>
      <input type="number" class="form-control" [(ngModel)]="shopProductId" name="shopProductId" required />
    </div>

    <div class="form-group">
      <label>New Price:</label>
      <input type="number" class="form-control" [(ngModel)]="newPrice" name="newPrice" required />
    </div>

    <button type="submit" class="btn btn-primary mt-2">Update Price</button>
  </form>
</div>
