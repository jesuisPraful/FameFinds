<div style="text-align:center;">
  <h1>View Shops</h1>
  <br />

   Search bar 
  <div class="row">
    <div class="col-md-5" style="text-align:right">
      <label>Search :</label>
    </div>
    <div class="col-md-5">
      <input type="text"
             placeholder="Shop name"
             class="form-control"
             (input)="searchShop(shopName.value)"
             #shopName />
    </div>
  </div>
  <br />

   Shops Table 
  <div class="table-responsive">
    <table class="table"
           style="border:5px solid rgba(220,230,242,1);"
           *ngIf="filteredShops.length > 0">
      <thead>
        <tr style="background-color:rgba(220,230,242,1); font-size:12pt">
          <th style="text-align:center">Shop Id</th>
          <th style="text-align:center">Shop Name</th>
          <th style="text-align:center">City Id</th>
          <th style="text-align:center">Pincode</th>
          <th style="text-align:center">Contact</th>
          <th style="text-align:center">Address</th>
          <th style="text-align:center">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let shop of filteredShops" style="background-color:white">
          <td style="text-align:center">{{ shop.shopId }}</td>
          <td style="text-align:center">{{ shop.shopName }}</td>
          <td style="text-align:center">{{ shop.cityId }}</td>
          <td style="text-align:center">{{ shop.pincode }}</td>
          <td style="text-align:center">{{ shop.contactNumber }}</td>
          <td style="text-align:center">{{ shop.fullAddress }}</td>
          <td style="text-align:center">
            <button class="btn btn-primary btn-sm" (click)="viewShopDetails(shop)">View Details</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

   No Shops Message 
  <div *ngIf="showMsgDiv" class="jumbotron" style="text-align:center;">
    <h4>No shops available</h4>
  </div>
</div>
