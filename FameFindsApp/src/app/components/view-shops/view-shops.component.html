<div class="container">
  <h2 style="text-align: center;">All Shops</h2>

  <!-- Search -->
  <div class="search-bar" style="margin-bottom: 20px; text-align: center;">
    <input type="text"
           class="form-control"
           style="max-width: 400px; display: inline-block;"
           placeholder="Search by shop name"
           (input)="searchShop(searchInput.value)"
           #searchInput />
  </div>

  <!-- No shops found message -->
  <div *ngIf="showMsgDiv" class="alert alert-warning text-center">
    No shops found.
  </div>

  <!-- Shops List -->
  <div class="row" *ngFor="let shop of filteredShops">
    <div class="col-md-12 card my-3 p-3">
      <h4>{{ shop.shopName }}</h4>
      <p><strong>Address:</strong> {{ shop.fullAddress }}</p>
      <p><strong>Contact:</strong> {{ shop.contactNumber }}</p>
      <p><strong>Email:</strong> {{ shop.emailId }}</p>
      <button class="btn btn-primary me-2" (click)="viewShopDetails(shop)">View Details</button>
      <button class="btn btn-outline-success" (click)="showMap(shop)">View on Map</button>
    </div>
  </div>

  <!-- Google Map -->
  <div *ngIf="selectedShop" class="card mt-4">
    <div class="card-body">
      <h5 class="card-title">Map for {{ selectedShop.shopName }}</h5>
      <div id="map" style="height: 400px; width: 100%;"></div>
    </div>
  </div>
</div>
