<div class="container">
  <h2 style="text-align: center;">All Shops</h2>

  <header>
    <div class="logo" tabindex="0">CityFamous</div>
  </header>

  <!-- Search Bar -->
  <!--<div class="search-bar" style="margin-bottom: 20px; text-align: center;">
    <input type="text"
           class="form-control"
           style="max-width: 400px; display: inline-block;"
           placeholder="Search by shop name"
           (input)="searchShop(searchInput.value)"
           #searchInput />
  </div>-->

  <!-- No Shops Found -->
  <div *ngIf="showMsgDiv" class="alert alert-warning text-center">
    No shops found.
  </div>

  <!-- Page Title -->
  <main role="main" aria-label="Shops selling selected product">
    <h1 class="page-title" id="pageTitle">
      Shops Selling {{ productName }}
    </h1>

    <!-- Shops List -->
    <section class="shop-cards" id="shopsContainer" aria-label="List of shops">
      <article class="shop-card"
               role="region"
               *ngFor="let shop of filteredShops"
               [attr.aria-label]="'Shop: ' + shop.shopName">

        <div class="shop-header">
          <div class="shop-thumb" aria-hidden="true">
            <span class="material-icons md-36">storefront</span>
          </div>
          <div class="shop-info">
            <h3 class="shop-name">{{ shop.shopName }}</h3>
            <address class="shop-address">{{ shop.fullAddress }}</address>
          </div>
        </div>

        <div class="contact-item" title="Phone">
          <span class="material-icons md-18" aria-hidden="true">phone</span>
          <span>{{ shop.contactNumber }}</span>
        </div>

        <div class="contact-item" title="Email">
          <span class="material-icons md-18" aria-hidden="true">email</span>
          <span>{{ shop.emailId }}</span>
        </div>

        <button class="btn btn-primary me-2" (click)="viewShopDetails(shop)">View Details</button>
        <button class="btn btn-outline-success" (click)="showMap(shop)">View on Map</button>
      </article>

      <!-- No Shops Message -->
      <div *ngIf="filteredShops.length === 0" class="no-shops-msg">
        No shops found for "{{ productName }}"
      </div>
    </section>

    <!-- Google Map -->
    <!--<div *ngIf="selectedShop" class="card mt-4">
      <div class="card-body">
        <h5 class="card-title">Map for {{ selectedShop.shopName }}</h5>
        <div id="map" style="height: 400px; width: 100%;"></div>
      </div>
    </div>
  </main>
</div>-->
