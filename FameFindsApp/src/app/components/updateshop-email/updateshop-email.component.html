<div class="center-wrapper">
  <div class="form-container">
    <label for="shopId">Shop ID:</label>
    <input id="shopId"
           type="number"
           [(ngModel)]="shopId"
           placeholder="Enter Shop ID" />

    <label for="currentEmail">Current Email ID:</label>
    <input id="currentEmail"
           type="text"
           [(ngModel)]="currentEmail"
           placeholder="Enter current Email ID" />

    <label for="newEmail">New Email ID:</label>
    <input id="newEmail"
           type="text"
           [(ngModel)]="newEmail"
           placeholder="Enter new Email ID" />

    <button (click)="updateEmail()">Update Email ID</button>

    <!-- Success and Error Messages -->
    <div *ngIf="message" class="success">{{ message }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </div>
</div>
