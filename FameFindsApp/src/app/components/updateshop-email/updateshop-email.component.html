<div class="form-container">
  <label>Shop ID:</label>
  <input type="number" [(ngModel)]="shopId" placeholder="Enter Shop ID" />

  <label>Current Email ID:</label>
  <input type="text" [(ngModel)]="currentEmail" placeholder="Enter current Email ID" />

  <label>New Email ID:</label>
  <input type="text" [(ngModel)]="newEmail" placeholder="Enter new Email ID" />

  <button (click)="updateEmail()">Update Email ID</button>
  <!-- Success and Error Messages -->
  <div *ngIf="message" class="success">{{ message }}</div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
